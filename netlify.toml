[build]
  publish = "public"

# Minificación automática al desplegar desde Git (no hay paso de compilación propio).
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = false
  minify = true

[build.processing.js]
  bundle = false
  minify = true

[build.processing.images]
  compress = true
